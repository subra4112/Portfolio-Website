<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beyfortus AE Reporting Companion</title>
<meta name="theme-color" content="#030712">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
html,
body {
  margin: 0;
  padding: 0;
  background: #030712;
}

body {
  font-family: "Figtree", sans-serif;
  -webkit-font-smoothing: antialiased;
}

a {
  color: #00d2ff;
}
a:hover {
  color: #f8fafc;
}

textarea::placeholder {
  color: #64748b;
}

/* ---------------------------------------------------------------------------
   View scale.

   There are exactly two views and they are chosen by the toggle, never by the
   browser window. Desktop values are the handoff spec verbatim. Phone values
   apply only inside [data-view="phone"], which is the device frame, so the
   layout is driven by the frame's fixed width rather than the viewport. There
   are deliberately no width based media queries here.
--------------------------------------------------------------------------- */
:root {
  --app-h: 100dvh;

  --pad-x: 40px;
  --pad-x-wide: 48px;
  --header-pad-y: 22px;
  --logo-h: 32px;

  /* compose */
  --eyebrow-size: 12.5px;
  --h1-size: 72px;
  --sub-size: 18.5px;
  --composer-mt: 36px;
  --composer-radius: 24px;
  --ta-pad: 26px 28px 10px;
  --ta-size: 19.5px;
  --ta-minh: 142px;
  --composer-foot-pad: 6px 14px 14px 24px;
  --mic-size: 38px;
  --hint-size: 12.5px;
  --submit-pad: 15px 28px;
  --submit-size: 17px;
  --chip-size: 14.5px;

  /* loader */
  --loader-logo-w: 290px;
  --loader-glow: 460px;
  --loader-gap: 52px;
  --loader-mono: 15px;

  /* thinking */
  --mark-size: 104px;
  --think-glow: 320px;
  --think-gap: 52px;
  --think-line-size: 28px;

  /* result */
  --result-cols: 1fr 340px;
  --result-gap: 52px;
  --result-h2: 52px;
  --result-body: 18px;
  --speak-size: 42px;
  --badge-pad: 12px 24px;

  /* emergency */
  --emergency-pad: 52px 40px;
  --emergency-h2: 62px;
  --emergency-lead: 19px;

  /* tier reference */
  --tier-cols: 250px 1fr;
  --tier-gap: 36px;
  --tier-row-pad: 24px 28px;
  --ref-h2: 40px;
  --term-h2: 46px;
  --term-body: 21px;
}

[data-view="phone"] {
  --app-h: 100%;

  --pad-x: 20px;
  --pad-x-wide: 20px;
  --header-pad-y: 16px;
  --logo-h: 24px;

  --eyebrow-size: 11px;
  --h1-size: 34px;
  --sub-size: 15.5px;
  --composer-mt: 26px;
  --composer-radius: 20px;
  --ta-pad: 18px 18px 6px;
  --ta-size: 16.5px;
  --ta-minh: 116px;
  --composer-foot-pad: 4px 12px 12px 14px;
  --mic-size: 44px;
  --hint-size: 11.5px;
  --submit-pad: 14px 20px;
  --submit-size: 16px;
  --chip-size: 14px;

  --loader-logo-w: 190px;
  --loader-glow: 300px;
  --loader-gap: 36px;
  --loader-mono: 13.5px;

  --mark-size: 82px;
  --think-glow: 230px;
  --think-gap: 36px;
  --think-line-size: 21px;

  --result-cols: 1fr;
  --result-gap: 26px;
  --result-h2: 31px;
  --result-body: 16.5px;
  --speak-size: 44px;
  --badge-pad: 11px 18px;

  --emergency-pad: 28px 20px;
  --emergency-h2: 36px;
  --emergency-lead: 17px;

  --tier-cols: 1fr;
  --tier-gap: 16px;
  --tier-row-pad: 20px 18px;
  --ref-h2: 26px;
  --term-h2: 29px;
  --term-body: 17.5px;
}

/* ---------- keyframes ---------- */
@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(16px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
@keyframes logoSettle {
  0% {
    opacity: 0;
    transform: translateY(14px) scale(0.97);
    filter: brightness(0) invert(1) blur(7px);
  }
  100% {
    opacity: 1;
    transform: translateY(0) scale(1);
    filter: brightness(0) invert(1) blur(0);
  }
}
@keyframes markPop {
  0% {
    opacity: 0;
    transform: scale(0.5);
  }
  55% {
    opacity: 1;
    transform: scale(1.14);
  }
  78% {
    transform: scale(0.96);
  }
  100% {
    opacity: 1;
    transform: scale(1);
  }
}
@keyframes softBreathe {
  0%,
  100% {
    opacity: 0.3;
    transform: scale(1);
  }
  50% {
    opacity: 0.6;
    transform: scale(1.06);
  }
}
@keyframes markSpin {
  0% {
    transform: rotate(0deg);
  }
  42% {
    transform: rotate(360deg);
  }
  100% {
    transform: rotate(360deg);
  }
}
@keyframes glowSync {
  0%,
  100% {
    transform: scale(0.9);
    opacity: 0.35;
  }
  50% {
    transform: scale(1.1);
    opacity: 0.85;
  }
}
@keyframes blink {
  0%,
  49% {
    opacity: 1;
  }
  50%,
  100% {
    opacity: 0;
  }
}
@keyframes lineIn {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
@keyframes pulseDot {
  0%,
  100% {
    opacity: 1;
  }
  50% {
    opacity: 0.35;
  }
}

/* ---------- interaction states (inline styles cannot express these) ---------- */
.glass-pill:hover {
  color: #f8fafc;
  border-color: rgba(0, 210, 255, 0.42);
}

.composer:focus-within {
  border-color: rgba(0, 210, 255, 0.55) !important;
  box-shadow: 0 8px 28px rgba(3, 7, 18, 0.55), 0 0 0 4px rgba(0, 210, 255, 0.1) !important;
}

.mic-btn:hover {
  color: #f8fafc;
  border-color: rgba(0, 210, 255, 0.5);
}

.pink-btn:hover:not(:disabled) {
  background: #f06595;
}
.pink-btn:active:not(:disabled) {
  transform: scale(0.97);
}

.chip:hover {
  border-color: rgba(0, 210, 255, 0.5);
  color: #f8fafc;
}

.speak-btn:hover {
  border-color: #00d2ff;
  color: #00d2ff;
}

.bubble:hover {
  border-color: var(--tier-color);
}
.bubble:active {
  transform: scale(0.97);
}

.back-pill:hover {
  color: #f8fafc;
  border-color: rgba(0, 210, 255, 0.45);
}

.emergency-cta:active {
  transform: scale(0.99);
}

/* ---------- text safety ----------
   Nothing should ever be clipped at a container edge. Long words break rather
   than push past their box. */
h1,
h2,
p,
button,
textarea,
.bubble,
.chip,
.hint {
  overflow-wrap: anywhere;
  word-break: normal;
}

/* ---------- phone view layout ----------
   Structural flips a variable cannot express. Scoped to the frame, so the
   browser window never triggers them. */
.bubble-wrap {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-content: flex-start;
}

[data-view="phone"] .bubble-wrap {
  flex-direction: column;
  flex-wrap: nowrap;
  gap: 9px;
}
[data-view="phone"] .bubble-wrap .bubble {
  width: 100%;
  justify-content: flex-start;
  text-align: left;
  /* Touch target floor. Beats the inline 42. */
  min-height: 48px !important;
  padding: 12px 18px !important;
}

/* Icon only clear action, so it never crowds the wordmark. The tier reference
   pill keeps its text, since a bare chevron reads as nothing. */
[data-view="phone"] .glass-pill.has-label .pill-label {
  display: none;
}
[data-view="phone"] .glass-pill.has-label {
  width: 44px;
  padding: 0 !important;
  justify-content: center;
  gap: 0;
}
[data-view="phone"] .glass-pill,
[data-view="phone"] .back-pill {
  min-height: 44px !important;
}
[data-view="phone"] .glass-pill {
  font-size: 12.5px;
}
[data-view="phone"] .back-pill {
  padding: 10px 16px !important;
  font-size: 13.5px !important;
}

/* Composer footer: mic and submit share the top row, the hint drops to its own
   line so the listening feedback stays visible. */
[data-view="phone"] .composer-foot {
  flex-wrap: wrap;
  gap: 10px !important;
}
[data-view="phone"] .composer-foot .mic-group {
  order: 1;
}
[data-view="phone"] .composer-foot .pink-btn {
  order: 2;
  margin-left: auto;
}
[data-view="phone"] .composer-foot .hint {
  order: 3;
  width: 100%;
  line-height: 1.4;
}

[data-view="phone"] .chip-row {
  flex-direction: column;
  align-items: stretch;
}
[data-view="phone"] .chip {
  width: 100%;
  min-height: 48px !important;
}

[data-view="phone"] .result-cta button {
  width: 100%;
  justify-content: center;
}
[data-view="phone"] .result-cta {
  margin-top: 24px !important;
}

[data-view="phone"] .footer-marks {
  gap: 14px !important;
}

/* The view toggle is a fixed pill in the bottom right corner. Reserve room for
   it in the footer so the partner marks are never hidden underneath it. Only
   needed in desktop view: in phone view the toggle sits outside the device
   frame, so nothing inside the frame can collide with it. */
.app-footer {
  padding-right: calc(var(--pad-x) + 168px) !important;
}
[data-view="phone"] .app-footer {
  padding-right: var(--pad-x) !important;
}

/* ---------- reduced motion ---------- */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
  /* the spinning mark and breathing glows freeze to a static glow */
  .spin-mark {
    animation: none !important;
  }
  .breathe-glow,
  .sync-glow {
    animation: none !important;
    opacity: 0.55 !important;
    transform: none !important;
  }
}

</style>
</head>

<div id="root"></div>
